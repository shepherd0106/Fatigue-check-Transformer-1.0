[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fatigue-training"
version = "0.1.0"
description = "Reviewed portable EEG and fNIRS fatigue classification framework"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.6,<3"]

[tool.setuptools.packages.find]
include = ["fatigue_training*"]

[tool.setuptools.package-data]
fatigue_training = ["configs/*.json"]
